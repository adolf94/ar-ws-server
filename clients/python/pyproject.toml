[project]
name = "ar-realtime-client"
version = "0.1.2"
description = "Publisher client for the realtime microservice (HTTP server API — publish/broadcast/unicast/group ops, Cloudflare-safe User-Agent). Contract: realtime docs/CONTRACT.md v1."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Token plumbing (owner spec: depend on ar-auth-client-*): ar_auth.ArAuthClient
# is NOT on PyPI — install the sibling repo's SDK (../ar-auth/ar-auth-client-python,
# `uv pip install -e`) if you want the built-in ArAuthTokenProvider; otherwise
# hand us any credential factory (CallableTokenProvider). See README "Tokens".

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ar_realtime_client"]
