name: deploy-gh-webhooks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to homelab via webhook (image push to GHCR always happens)"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Must match the Ar.Auth.OpenId pin in src/Realtime/Realtime.csproj — the
  # staged artifact (below) is what the container restore resolves against.
  AR_AUTH_OPENID_VERSION: "1.2.1"

jobs:
  build:
    runs-on: ubuntu-latest
    # gh_webhooks requires the tag as sha-<short7>; the deploy job must POST the
    # exact same tag the metadata below pushed to GHCR.
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Dockerfile COPYs nuget-feed/ (gitignored). CI stages the published
      # Ar.Auth.OpenId pin from GitHub Packages here; local dev stages the
      # same-versioned pack via dev/build-image.sh (../local-nuget).
      - name: Stage vendored NuGet feed (Ar.Auth.OpenId from GitHub Packages)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p nuget-feed
          target="nuget-feed/Ar.Auth.OpenId.${AR_AUTH_OPENID_VERSION}.nupkg"
          if ! curl --fail-with-body --show-error --silent --location \
               -u "adolf94:${TOKEN}" -H 'Accept: application/octet-stream' \
               "https://nuget.pkg.github.com/adolf94/download/ar.auth.openid/${AR_AUTH_OPENID_VERSION}/ar.auth.openid.${AR_AUTH_OPENID_VERSION}.nupkg" \
               -o "$target"; then
            echo "::error::Could not fetch Ar.Auth.OpenId ${AR_AUTH_OPENID_VERSION} from nuget.pkg.github.com/adolf94."
            echo "::error::GITHUB_TOKEN cannot read packages of another repo by default: open the Ar.Auth.OpenId package page (Settings) and grant adolf94/ar-ws-server read access, or store a classic PAT with read:packages as a secret and pass it in TOKEN."
            exit 1
          fi
          ls -l nuget-feed/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          echo "tag=sha-$(printf '%s' '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # deploy/ rides the shorter image name ghcr.io/adolf94/realtime (compose
      # default + the gh_webhooks deploy_config.json image field). Alias the
      # repo-named manifest onto it — server-side retag, no rebuild.
      - name: Alias realtime naming (sha tag + latest)
        if: github.ref_name == 'main'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          src="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          for target in \
            "${{ env.REGISTRY }}/adolf94/realtime:${TAG}" \
            "${{ env.REGISTRY }}/adolf94/realtime:latest"; do
            docker buildx imagetools create -t "$target" "$src"
          done
          echo "aliased: $src"

  deploy:
    # Separate stage: only POSTs the webhook, never rebuilds the image.
    # Needs the exact tag build pushed (see build.outputs.tag).
    needs: build
    # Manual dispatch can skip the deploy (image-only rebuilds).
    if: github.event_name == 'push' || inputs.deploy == true
    runs-on: ubuntu-latest
    steps:
      - name: Trigger homelab deploy webhook (gh_webhooks)
        env:
          CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOOK_SECRET: ${{ secrets.HOMELAB_WEBHOOK_SECRET }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          BODY=$(jq -nc --arg repo "${{ github.repository }}" --arg tag "$TAG" '{repo:$repo, tag:$tag}')
          TS=$(date +%s)
          SIG=$(printf '%s.%s' "$TS" "$BODY" | openssl dgst -sha256 -hmac "$HOOK_SECRET" -r | cut -d' ' -f1)
          echo "Triggering webhook for ${BODY}"
          curl --fail-with-body --show-error --retry 3 --retry-all-errors --max-time 30 \
            --write-out '\nHTTP status: %{http_code}\n' \
            -H "CF-Access-Client-Id: $CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CLIENT_SECRET" \
            -H "X-Timestamp: $TS" -H "X-Signature: $SIG" \
            -H "Content-Type: application/json" --data "$BODY" \
            https://apis.adolfrey.com/gh_webhooks/d
